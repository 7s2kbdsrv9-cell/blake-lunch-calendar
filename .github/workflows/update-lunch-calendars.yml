name: Update Blake lunch calendars

on:
  workflow_dispatch:
  schedule:
    - cron: "15 12 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          pip install requests beautifulsoup4 pdfplumber

      - name: Update calendars
        run: python update_calendars.py

      - name: Save updated calendars
        run: |
          git config user.name "Blake Lunch Calendar"
          git config user.email "actions@github.com"
          git add middle-school.ics upper-elementary.ics menu-sources.json
          if git diff --cached --quiet; then
            echo "No new menus found."
          else
            git commit -m "Update Blake lunch calendars"
            git push
          fi
